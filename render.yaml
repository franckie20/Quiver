services:
  # 1. Quarkus Backend (Docker)
  - type: web
    name: quiver-backend
    env: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: QUARKUS_PROFILE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: quiver-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: quiver-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: quiver-db
          property: database
      - key: QUARKUS_DATASOURCE_USERNAME
        fromDatabase:
          name: quiver-db
          property: user
      - key: QUARKUS_DATASOURCE_PASSWORD
        fromDatabase:
          name: quiver-db
          property: password

  # 2. Angular Frontend (via Docker & Nginx)
  - type: web
    name: quiver-frontend
    env: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: PORT
        value: 8080

databases:
  - name: quiver-db
    databaseName: quiver
    user: quiver_user
    region: frankfurt
    plan: free