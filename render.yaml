services:
  # 1. Backend
  - type: web
    name: quiver-backend
    env: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile

  # 2. Frontend
  - type: static
    name: quiver-frontend
    env: static
    region: frankfurt
    buildCommand: cd frontend && npm ci && npm run build -- --configuration=production
    staticPublishPath: ./frontend/dist/quiver-app/browser
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: quiver-backend
          property: url