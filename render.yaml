services:
  # 1. Backend
  - type: web
    name: quiver-backend
    env: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile

  # 2. Frontend
  - type: web
    name: quiver-frontend
    env: static
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build -- --configuration=production
    staticPublishPath: ./frontend/dist/quiver-app/browser