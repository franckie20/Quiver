server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enable Gzip compression for faster asset loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Angular SPA Routing Fallback
    # Ensures page refreshes on sub-routes (e.g., /dashboard) route back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy to Quiver Backend
    # Forwards requests starting with /api/ to your quiver-backend container
    location /api/ {
        proxy_pass http://quiver-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets (JS, CSS, images) for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}