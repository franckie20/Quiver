server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compressie
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Standaard Angular routing (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy voor de Backend (Voorkomt CORS!)
    location /api/ {
        proxy_pass https://quiver-backend-0y8y.onrender.com/api/;

        # Noodzakelijk voor HTTPS-backends op Render
        proxy_ssl_server_name on;

        # Headers meesturen
        proxy_set_header Host quiver-backend-0y8y.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
