server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compressie voor betere laadtijden
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cruciaal voor Angular (Single Page Application routing):
    # Als een route niet wordt gevonden, stuur hem door naar index.html zodat Angular router het overneemt
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optioneel: als je caching wilt instellen voor statische assets (JS, CSS, afbeeldingen)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
