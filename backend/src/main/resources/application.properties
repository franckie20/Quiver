# Flyway & Hibernate configuration
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.mapping.format.global=ignore

# OpenAPI Configuration
quarkus.openapi.generator.server.spec=quiver-api.yaml
quarkus.openapi.generator.server.input-base-dir=src/main/openapi
quarkus.openapi.generator.server.use=openapitools
quarkus.openapi.generator.server.base-package=com.franckie20

# Production configuration
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}